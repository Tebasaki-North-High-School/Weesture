[project]
name = "weesture"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.15.0",
    "weeee",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "typos>=1.46.2",
    "scipy-stubs>=1.17.1.4",
]

[project.scripts]
weesture = "weesture.wiisture:main"
weesture-record = "weesture.recorder:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.uv]
package = true

[tool.uv.sources]
weeee = { git = "https://github.com/Tebasaki-North-High-School/Weeee" }
